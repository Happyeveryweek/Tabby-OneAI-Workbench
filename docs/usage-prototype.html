<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TabbyOneAi — 用量统计重新设计原型</title>
<style>
  :root {
    --font-sans: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
    --radius-dialog: 14px;
    --radius-card: 10px;
    --radius-control: 8px;
    --radius-pill: 999px;
  }

  /* 与 src/appearance.ts 保持一致的配色 Token 体系 */
  [data-theme="dark"] {
    color-scheme: dark;
    --palette-canvas: #0b0f14;
    --palette-surface: #111821;
    --palette-panel: #141d27;
    --palette-elevated: #16202c;
    --palette-muted: #1b2532;
    --palette-control: #182330;
    --palette-control-hover: #223142;
    --palette-hover: #1c2938;
    --palette-selected: #1b364d;
    --palette-line: #243242;
    --palette-line-strong: #34475c;
    --palette-fg: #e6edf5;
    --palette-fg-muted: #c2cedb;
    --palette-fg-subtle: #8b9bb0;
    --palette-fg-faint: #627286;
    --palette-accent: #38bdf8;
    --palette-success: #34d399;
    --palette-warning: #fbbf24;
    --palette-danger: #fb7185;
    --palette-violet: #a78bfa;
    --shadow-dialog: 0 24px 72px rgba(0, 0, 0, 0.58), 0 0 0 1px rgba(255, 255, 255, 0.04);
    --heat-empty: rgba(255, 255, 255, 0.06);
  }

  [data-theme="light"] {
    color-scheme: light;
    --palette-canvas: #eef2f6;
    --palette-surface: #ffffff;
    --palette-panel: #f6f8fa;
    --palette-elevated: #f8fafc;
    --palette-muted: #f0f3f6;
    --palette-control: #ffffff;
    --palette-control-hover: #f1f5f9;
    --palette-hover: #f1f5f9;
    --palette-selected: #e0f2fe;
    --palette-line: #dde4ec;
    --palette-line-strong: #bcc8d6;
    --palette-fg: #1c2430;
    --palette-fg-muted: #3b4758;
    --palette-fg-subtle: #64748b;
    --palette-fg-faint: #8a99ad;
    --palette-accent: #0284c7;
    --palette-success: #10b981;
    --palette-warning: #d97706;
    --palette-danger: #e11d48;
    --palette-violet: #7c3aed;
    --shadow-dialog: 0 24px 64px rgba(15, 23, 42, 0.16), 0 0 0 1px rgba(15, 23, 42, 0.06);
    --heat-empty: rgba(15, 23, 42, 0.07);
  }

  [data-theme="nord"] {
    color-scheme: dark;
    --palette-canvas: #242933;
    --palette-surface: #2e3440;
    --palette-panel: #333a47;
    --palette-elevated: #373f4e;
    --palette-muted: #3b4252;
    --palette-control: #3b4252;
    --palette-control-hover: #465063;
    --palette-hover: #3f4758;
    --palette-selected: #3f526b;
    --palette-line: #434c5e;
    --palette-line-strong: #566176;
    --palette-fg: #eceff4;
    --palette-fg-muted: #d8dee9;
    --palette-fg-subtle: #a7b0c0;
    --palette-fg-faint: #828d9f;
    --palette-accent: #88c0d0;
    --palette-success: #a3be8c;
    --palette-warning: #ebcb8b;
    --palette-danger: #bf616a;
    --palette-violet: #b48ead;
    --shadow-dialog: 0 24px 72px rgba(0, 0, 0, 0.45);
    --heat-empty: rgba(236, 239, 244, 0.07);
  }

  [data-theme="ink"] {
    color-scheme: dark;
    --palette-canvas: #111520;
    --palette-surface: #181d2b;
    --palette-panel: #1d2334;
    --palette-elevated: #21283b;
    --palette-muted: #262e42;
    --palette-control: #232b40;
    --palette-control-hover: #2e3852;
    --palette-hover: #262f45;
    --palette-selected: #2d3c64;
    --palette-line: #2c354c;
    --palette-line-strong: #414d6d;
    --palette-fg: #e2e7f4;
    --palette-fg-muted: #c2cadc;
    --palette-fg-subtle: #909bb5;
    --palette-fg-faint: #6d7894;
    --palette-accent: #8aaaf0;
    --palette-success: #7fd090;
    --palette-warning: #e6be64;
    --palette-danger: #ec7a80;
    --palette-violet: #ba98e2;
    --shadow-dialog: 0 24px 72px rgba(0, 0, 0, 0.56);
    --heat-empty: rgba(226, 231, 244, 0.07);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.45;
    color: var(--palette-fg);
    background: var(--palette-canvas);
    -webkit-font-smoothing: antialiased;
  }

  /* 背景模拟 Tabby 宿主环境 + 顶部原型预览条 */
  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 28px;
    gap: 14px;
    background:
      radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--palette-accent) 10%, transparent), transparent 42%),
      radial-gradient(circle at 82% 88%, color-mix(in srgb, var(--palette-violet) 8%, transparent), transparent 42%),
      var(--palette-canvas);
  }

  .demo-bar {
    width: min(1100px, 100%);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 14px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--palette-surface) 88%, transparent);
    border: 1px solid var(--palette-line);
    backdrop-filter: blur(8px);
    font-size: 12px;
  }

  .demo-bar-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .demo-tag {
    font-weight: 600;
    color: var(--palette-accent);
    padding-right: 6px;
    margin-right: 2px;
    border-right: 1px solid var(--palette-line);
    letter-spacing: 0.02em;
  }

  .demo-label {
    color: var(--palette-fg-subtle);
    font-size: 11.5px;
  }

  .demo-pill {
    border: 1px solid var(--palette-line);
    background: var(--palette-control);
    color: var(--palette-fg-muted);
    padding: 4px 9px;
    border-radius: 6px;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.14s ease;
  }

  .demo-pill:hover {
    background: var(--palette-control-hover);
    color: var(--palette-fg);
  }

  .demo-pill.active {
    background: var(--palette-selected);
    border-color: color-mix(in srgb, var(--palette-accent) 55%, var(--palette-line));
    color: var(--palette-accent);
    font-weight: 600;
  }

  /* 弹窗容器：加大尺寸，确保一屏完整显示 KPI + 热力图 + 模型用量明细 */
  .usage-dialog {
    width: min(1100px, 100%);
    height: min(800px, calc(100dvh - 68px));
    min-height: 600px;
    display: flex;
    flex-direction: column;
    background: var(--palette-surface);
    border: 1px solid var(--palette-line);
    border-radius: var(--radius-dialog);
    box-shadow: var(--shadow-dialog);
    overflow: hidden;
  }

  .model-summary-pills {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .model-brief-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    background: var(--palette-panel);
    border: 1px solid var(--palette-line);
    font-size: 11px;
    color: var(--palette-fg-muted);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: all 0.13s ease;
  }

  .model-brief-chip:hover {
    border-color: var(--palette-line-strong);
    background: var(--palette-hover);
    color: var(--palette-fg);
  }

  .model-brief-chip.active {
    background: var(--palette-selected);
    border-color: var(--palette-accent);
    color: var(--palette-fg);
  }

  .model-brief-chip b {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--palette-fg);
  }

  .model-brief-chip .pct {
    color: var(--palette-fg-subtle);
  }

  /* 1. 弹窗顶栏 */
  .dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--palette-line);
    background: var(--palette-panel);
    flex: none;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .header-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--palette-accent) 14%, transparent);
    color: var(--palette-accent);
    flex: none;
  }

  .header-title-wrap {
    display: flex;
    align-items: baseline;
    gap: 9px;
    min-width: 0;
  }

  .dialog-header h1 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .header-breadcrumb {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--palette-fg-subtle);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .header-breadcrumb .sep {
    opacity: 0.45;
  }

  .header-breadcrumb .current {
    color: var(--palette-fg-muted);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 30px;
    padding: 0 10px;
    border-radius: 7px;
    border: 1px solid var(--palette-line);
    background: var(--palette-control);
    color: var(--palette-fg-muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
  }

  .icon-btn:hover {
    background: var(--palette-control-hover);
    color: var(--palette-fg);
    border-color: var(--palette-line-strong);
  }

  .icon-btn.close-btn {
    width: 30px;
    padding: 0;
    border-color: transparent;
    background: transparent;
    font-size: 18px;
    line-height: 1;
  }

  .icon-btn.close-btn:hover {
    background: var(--palette-hover);
  }

  .spin svg {
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* 2. 三级级联筛选栏：项目 -> 会话 -> 模型 */
  .filter-toolbar {
    display: grid;
    grid-template-columns: minmax(175px, 1fr) 16px minmax(230px, 1.45fr) 16px minmax(175px, 1fr);
    align-items: end;
    gap: 6px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--palette-line);
    background: color-mix(in srgb, var(--palette-panel) 55%, var(--palette-surface));
    flex: none;
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .filter-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .filter-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--palette-fg-subtle);
    letter-spacing: 0.03em;
  }

  .filter-badge {
    font-size: 10.5px;
    font-weight: 500;
    padding: 1px 6px;
    border-radius: var(--radius-pill);
    background: color-mix(in srgb, var(--palette-accent) 13%, transparent);
    color: var(--palette-accent);
    white-space: nowrap;
  }

  .filter-badge.neutral {
    background: color-mix(in srgb, var(--palette-fg) 8%, transparent);
    color: var(--palette-fg-subtle);
  }

  .cselect-trigger {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    border-radius: 9px;
    border: 1px solid var(--palette-line);
    background: var(--palette-control);
    color: var(--palette-fg);
    font: inherit;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
    min-width: 0;
  }

  .cselect-trigger:hover:not(:disabled) {
    border-color: var(--palette-line-strong);
    background: var(--palette-control-hover);
  }

  .cselect-trigger[aria-expanded="true"] {
    border-color: var(--palette-accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--palette-accent) 18%, transparent);
  }

  .cselect-trigger:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .cselect-value {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cselect-arrow {
    color: var(--palette-fg-subtle);
    display: flex;
    flex: none;
    transition: transform 0.16s ease;
  }

  .cselect-trigger[aria-expanded="true"] .cselect-arrow {
    transform: rotate(180deg);
    color: var(--palette-accent);
  }

  .cselect-popover {
    position: fixed;
    z-index: 95;
    min-width: 190px;
    max-height: 270px;
    overflow-y: auto;
    padding: 5px;
    border-radius: 11px;
    background: var(--palette-surface);
    border: 1px solid var(--palette-line-strong);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.48);
    display: none;
    flex-direction: column;
    gap: 2px;
  }

  .cselect-popover.open { display: flex; }

  .cselect-option {
    width: 100%;
    padding: 7px 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--palette-fg-muted);
    font: inherit;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    cursor: pointer;
  }

  .cselect-option:hover {
    background: var(--palette-hover);
    color: var(--palette-fg);
  }

  .cselect-option.selected {
    background: var(--palette-selected);
    color: var(--palette-fg);
    font-weight: 600;
  }

  .cselect-opt-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cselect-opt-meta {
    font-size: 10.5px;
    font-family: var(--font-mono);
    color: var(--palette-fg-subtle);
    padding: 1px 5px;
    border-radius: 5px;
    background: color-mix(in srgb, var(--palette-fg) 7%, transparent);
    flex: none;
  }

  .cselect-opt-check {
    color: var(--palette-accent);
    width: 14px;
    display: inline-grid;
    place-items: center;
    flex: none;
  }

  .cascade-arrow {
    height: 34px;
    display: grid;
    place-items: center;
    color: var(--palette-fg-faint);
    user-select: none;
  }

  /* 3. 主内容滚动区 */
  .dialog-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 自定义滚动条 */
  .dialog-body::-webkit-scrollbar,
  .heatmap-scroll::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .dialog-body::-webkit-scrollbar-thumb,
  .heatmap-scroll::-webkit-scrollbar-thumb {
    background: var(--palette-line-strong);
    border-radius: 999px;
  }
  .dialog-body::-webkit-scrollbar-track,
  .heatmap-scroll::-webkit-scrollbar-track {
    background: transparent;
  }

  /* 周期切换条：替代旧版 3 行重复大卡片 */
  .period-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .segmented {
    display: inline-flex;
    padding: 3px;
    border-radius: 9px;
    background: var(--palette-panel);
    border: 1px solid var(--palette-line);
    gap: 2px;
  }

  .segmented button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--palette-fg-subtle);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.14s ease;
  }

  .segmented button:hover {
    color: var(--palette-fg);
  }

  .segmented button[aria-pressed="true"] {
    background: var(--palette-selected);
    border-color: color-mix(in srgb, var(--palette-accent) 40%, transparent);
    color: var(--palette-fg);
    font-weight: 600;
  }

  .segmented .seg-val {
    font-family: var(--font-mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    padding: 1px 5px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--palette-fg) 8%, transparent);
    color: var(--palette-fg-muted);
  }

  .segmented button[aria-pressed="true"] .seg-val {
    background: color-mix(in srgb, var(--palette-accent) 22%, transparent);
    color: var(--palette-accent);
  }

  .period-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--palette-fg-subtle);
    font-variant-numeric: tabular-nums;
  }

  .scope-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--palette-line);
    background: var(--palette-elevated);
    color: var(--palette-fg-muted);
    font-size: 11.5px;
  }

  .scope-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--palette-success);
  }

  /* 4 张核心 KPI 卡片 */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .kpi-card {
    padding: 12px 14px;
    border-radius: var(--radius-card);
    border: 1px solid var(--palette-line);
    background: var(--palette-elevated);
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    overflow: hidden;
  }

  .kpi-card.primary {
    background: linear-gradient(
      145deg,
      color-mix(in srgb, var(--palette-accent) 11%, var(--palette-elevated)),
      var(--palette-elevated) 68%
    );
    border-color: color-mix(in srgb, var(--palette-accent) 32%, var(--palette-line));
  }

  .kpi-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--palette-fg-subtle);
  }

  .kpi-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    color: var(--palette-fg);
  }

  .kpi-card.primary .kpi-value {
    color: var(--palette-accent);
  }

  .kpi-sub {
    font-size: 11.5px;
    color: var(--palette-fg-subtle);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 通用内容卡片 */
  .panel-card {
    border: 1px solid var(--palette-line);
    border-radius: var(--radius-card);
    background: var(--palette-elevated);
    padding: 13px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .card-title-group {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .card-title {
    margin: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--palette-fg);
  }

  .card-subtitle {
    font-size: 11.5px;
    color: var(--palette-fg-subtle);
    font-variant-numeric: tabular-nums;
  }

  .card-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* 热力图 */
  .heatmap-scroll {
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .heatmap-grid {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    width: max-content;
    --cell: 11px;
    --gap: 3px;
  }

  .heatmap-weekdays {
    display: grid;
    grid-template-rows: 16px repeat(7, var(--cell));
    gap: var(--gap);
    padding-right: 6px;
    position: sticky;
    left: 0;
    background: var(--palette-elevated);
    z-index: 1;

(() => {
  // 基准日期固定为 2026-11-19，贴合当前截图日期
  const TODAY = new Date(2026, 10, 19); // 2026-11-19
  const DAY_MS = 86400000;

  const modelColors = {
    'gpt-5.4-codex': '#38bdf8',
    'gpt-6.2-sol': '#38bdf8',
    'gpt-5.3-codex-mini': '#34d399',
    'o3': '#a78bfa',
    'claude-sonnet-4.5': '#fb923c',
    'claude-opus-4.1': '#f472b6',
    'gemini-2.5-pro': '#60a5fa',
    'kimi-k2-thinking': '#fbbf24',
  };

  function daysAgo(n) {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - n);
    return d.getTime();
  }

  function makeDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // 生成逼真的示例数据集（覆盖单模型会话、多模型会话、多 CLI 项目与年度历史）
  function seedHistory(baseDays, entriesPerDaySpec) {
    const out = [];
    for (const item of entriesPerDaySpec) {
      out.push({
        date: daysAgo(item.ago),
        model: item.model,
        input: item.input,
        cached: item.cached,
        output: item.output,
      });
    }
    return out;
  }

  // 额外生成跨月历史点以展示丰富年度热力图
  function generateYearActivity(seed, modelWeights, totalCount) {
    let s = seed;
    const rand = () => {
      s = (s * 1664525 + 1013904223) % 4294967296;
      return s / 4294967296;
    };
    const rows = [];
    for (let i = 0; i < totalCount; i++) {
      const ago = Math.floor(rand() * 340) + 5;
      const pick = rand();
      let acc = 0;
      let model = modelWeights[0][0];
      for (const [m, w] of modelWeights) {
        acc += w;
        if (pick <= acc) { model = m; break; }
      }
      const scale = 0.35 + rand() * 2.2;
      const input = Math.round(1450000 * scale);
      const cached = Math.round(input * (3.2 + rand() * 3.8));
      const output = Math.round(input * (0.14 + rand() * 0.22));
      rows.push({ date: daysAgo(ago), model, input, cached, output });
    }
    return rows;
  }

  const MOCK_PROJECTS = [
    {
      id: 'tabby-oneai',
      name: 'TabbyOneAi',
      env: 'PowerShell 7',
      missingSessions: 1,
      sessions: [

  // 状态管理：严格对应 项目 -> 会话 -> 模型 + 周期
  const state = {
    projectId: 'tabby-oneai',
    sessionId: 'tabby-s1', // '' 表示该项目全部会话
    model: '',             // '' 表示全部模型
    period: 'year',        // 'year' | 'month' | 'week'
  };

  const compactFmt = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
  const exactFmt = new Intl.NumberFormat('en-US');

  const $ = (id) => document.getElementById(id);
  const tooltip = $('tooltip');
  let activeTrigger = null;

  function closeCustomSelect() {
    const pop = $('cselectPopover');
    pop.classList.remove('open');
    if (activeTrigger) {
      activeTrigger.setAttribute('aria-expanded', 'false');
      activeTrigger = null;
    }
  }

  function renderCustomSelect(mountEl, { value, options, disabled = false, onChange }) {
    const cur = options.find(o => o.value === value) || options[0] || { label: '无选项', value: '' };
    mountEl.innerHTML = `
      <button type="button" class="cselect-trigger" aria-haspopup="listbox" aria-expanded="false" ${disabled ? 'disabled' : ''}>
        <span class="cselect-value">${cur.label}</span>
        <span class="cselect-arrow"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg></span>
      </button>
    `;
    const btn = mountEl.querySelector('.cselect-trigger');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (disabled) return;
      const pop = $('cselectPopover');
      if (activeTrigger === btn && pop.classList.contains('open')) { closeCustomSelect(); return; }
      closeCustomSelect();
      activeTrigger = btn;
      btn.setAttribute('aria-expanded', 'true');
      pop.innerHTML = options.map((o, idx) => `
        <button type="button" class="cselect-option ${o.value === value ? 'selected' : ''}" data-cidx="${idx}" role="option">
          <span class="cselect-opt-label">${o.label}</span>
          ${o.meta ? `<span class="cselect-opt-meta">${o.meta}</span>` : ''}
          <span class="cselect-opt-check">${o.value === value ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>' : ''}</span>
        </button>
      `).join('');
      const rect = btn.getBoundingClientRect();
      pop.style.width = `${Math.max(rect.width, 190)}px`;
      pop.classList.add('open');
      const popRect = pop.getBoundingClientRect();
      pop.style.left = `${Math.min(Math.max(8, rect.left), window.innerWidth - popRect.width - 8)}px`;
      pop.style.top = `${rect.bottom + 5}px`;
      pop.querySelectorAll('.cselect-option').forEach(optBtn => {
        optBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const picked = options[Number(optBtn.dataset.cidx)];
          closeCustomSelect();
          if (picked && picked.value !== value) onChange(picked.value);
        });
      });
    });
  }

  function formatCompact(n) {
    if (!n) return '0';
    return compactFmt.format(n);
  }

  function getProject() {
    return MOCK_PROJECTS.find(p => p.id === state.projectId) || MOCK_PROJECTS[0];
  }

  function getScopedSessions(project) {
    if (!state.sessionId) return project.sessions;
    const found = project.sessions.find(s => s.id === state.sessionId);
    return found ? [found] : project.sessions;
  }

  function getAvailableModels(sessions) {
    const totals = new Map();
    for (const s of sessions) {
      for (const e of s.entries) {
        totals.set(e.model, (totals.get(e.model) || 0) + e.input + e.cached + e.output);
      }
    }
    return [...totals.entries()].sort((a, b) => b[1] - a[1]).map(([m]) => m);
  }

  function periodStarts() {
    const year = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - 364);
    const month = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    const week = new Date(TODAY);
    week.setDate(week.getDate() - ((week.getDay() + 6) % 7));
    return { year, month, week };
  }

  function summarize(sessions, modelFilter, activePeriod) {
    const starts = periodStarts();
    const periodSummary = {
      year: { tokens: 0, sessions: new Set(), days: new Set() },
      month: { tokens: 0, sessions: new Set(), days: new Set() },
      week: { tokens: 0, sessions: new Set(), days: new Set() },
    };

    const dailyMap = new Map(); // dateKey -> { tokens, input, cached, output }
    const modelMap = new Map(); // model -> { tokens, input, cached, output }

    let totalInput = 0, totalCached = 0, totalOutput = 0, totalTokens = 0;

    for (const sess of sessions) {
      for (const e of sess.entries) {
        if (e.date > TODAY.getTime() || e.date < starts.year.getTime()) continue;
        if (modelFilter && e.model !== modelFilter) continue;
        const tokens = e.input + e.cached + e.output;
        const key = makeDateKey(new Date(e.date));

        for (const p of ['year', 'month', 'week']) {
          if (e.date >= starts[p].getTime()) {
            periodSummary[p].tokens += tokens;
            periodSummary[p].sessions.add(sess.id);
            periodSummary[p].days.add(key);
          }
        }

        if (e.date >= starts[activePeriod].getTime()) {
          totalInput += e.input;
          totalCached += e.cached;
          totalOutput += e.output;
          totalTokens += tokens;

          const dayRec = dailyMap.get(key) || { tokens: 0, input: 0, cached: 0, output: 0 };
          dayRec.tokens += tokens;
          dayRec.input += e.input;
          dayRec.cached += e.cached;
          dayRec.output += e.output;
          dailyMap.set(key, dayRec);

          const mRec = modelMap.get(e.model) || { model: e.model, tokens: 0, input: 0, cached: 0, output: 0 };
          mRec.tokens += tokens;
          mRec.input += e.input;
          mRec.cached += e.cached;
          mRec.output += e.output;
          modelMap.set(e.model, mRec);
        }
      }
    }

    const start = starts[activePeriod];
    const peak = Math.max(0, ...[...dailyMap.values()].map(v => v.tokens));

    // 生成热力图周数据（近 12 个月使用）
    const weeks = [];
    const cursor = new Date(start);
    cursor.setDate(cursor.getDate() - ((cursor.getDay() + 6) % 7));
    let lastMonthIdx = -99;
    while (cursor <= TODAY) {
      const weekIndex = weeks.length;
      let monthLabel = '';
      const days = [];
      for (let i = 0; i < 7; i++) {
        const visible = cursor >= start && cursor <= TODAY;
        if (visible && ((weekIndex === 0 && i === 0) || cursor.getDate() === 1)) {
          // 防止前两列月份标签紧挨重叠（如旧版 11月 12月粘连）
          if (weekIndex - lastMonthIdx >= 3) {
            monthLabel = `${cursor.getMonth() + 1}月`;
            lastMonthIdx = weekIndex;
          }
        }
        const key = makeDateKey(cursor);
        const rec = visible ? (dailyMap.get(key) || { tokens: 0, input: 0, cached: 0, output: 0 }) : null;
        const level = rec && rec.tokens > 0 && peak > 0 ? Math.min(4, Math.ceil(4 * Math.sqrt(rec.tokens / peak))) : 0;
        days.push({ date: key, visible, rec, level });
        cursor.setDate(cursor.getDate() + 1);
      }
      weeks.push({ monthLabel, days });
    }

    // 生成按日序列（本月 / 本周柱状图使用）
    const daySeries = [];
    const dayCursor = new Date(start);
    const weekdayShort = ['日', '一', '二', '三', '四', '五', '六'];
    while (dayCursor <= TODAY) {
      const key = makeDateKey(dayCursor);
      const rec = dailyMap.get(key) || { tokens: 0, input: 0, cached: 0, output: 0 };
      daySeries.push({
        date: key,
        label: activePeriod === 'week'
          ? `周${weekdayShort[dayCursor.getDay()]} ${dayCursor.getMonth() + 1}/${dayCursor.getDate()}`
          : `${dayCursor.getDate()}日`,
        rec,
      });
      dayCursor.setDate(dayCursor.getDate() + 1);
    }

    const models = [...modelMap.values()].sort((a, b) => b.tokens - a.tokens);

    return {
      starts,
      rangeText: `${makeDateKey(start)} 至 ${makeDateKey(TODAY)}`,
      periodSummary,
      totals: { tokens: totalTokens, input: totalInput, cached: totalCached, output: totalOutput },
      activeSessions: periodSummary[activePeriod].sessions.size,
      activeDays: periodSummary[activePeriod].days.size,
      peak,
      weeks,
      daySeries,
      models,
    };
  }

  function populateSelects() {
    const project = getProject();
    $('projectEnvBadge').textContent = project.env;
    renderCustomSelect($('projectSelectMount'), {
      value: state.projectId,
      options: MOCK_PROJECTS.map(p => ({ value: p.id, label: p.name, meta: p.env })),
      onChange: (val) => { state.projectId = val; state.sessionId = ''; state.model = ''; render(); },
    });

    if (state.sessionId && !project.sessions.some(s => s.id === state.sessionId)) state.sessionId = '';
    const currentSession = project.sessions.find(s => s.id === state.sessionId);
    const sessBadge = $('sessionCountBadge');
    if (currentSession) {
      sessBadge.textContent = currentSession.cli;
      sessBadge.className = 'filter-badge';
    } else {
      sessBadge.textContent = `全部 ${project.sessions.length} 条`;
      sessBadge.className = 'filter-badge neutral';
    }
    renderCustomSelect($('sessionSelectMount'), {
      value: state.sessionId,
      options: [
        { value: '', label: `全部会话（共 ${project.sessions.length} 条）`, meta: '汇总' },
        ...project.sessions.map(s => ({ value: s.id, label: s.title, meta: s.cli })),
      ],
      onChange: (val) => { state.sessionId = val; state.model = ''; render(); },
    });

    const scopedSessions = getScopedSessions(project);
    const availableModels = getAvailableModels(scopedSessions);
    if (state.model && !availableModels.includes(state.model)) state.model = '';
    const modelBadge = $('modelCountBadge');
    if (state.model) {
      modelBadge.textContent = '单模型';
      modelBadge.className = 'filter-badge';
    } else if (availableModels.length <= 1) {
      modelBadge.textContent = availableModels.length === 1 ? '仅 1 个模型' : '无记录';
      modelBadge.className = 'filter-badge neutral';
    } else {
      modelBadge.textContent = `${availableModels.length} 个模型可选`;
      modelBadge.className = 'filter-badge neutral';
    }
    renderCustomSelect($('modelSelectMount'), {
      value: state.model,
      disabled: availableModels.length === 0,
      options: [
        { value: '', label: `全部模型${availableModels.length ? `（${availableModels.length} 个）` : ''}` },
        ...availableModels.map(m => ({ value: m, label: m })),
      ],
      onChange: (val) => { state.model = val; render(); },
    });
  }

  function positionTooltip(ev) {
    const pad = 12;
    const rect = tooltip.getBoundingClientRect();
    let left = ev.clientX + 14;
    let top = ev.clientY - rect.height - 10;
    if (left + rect.width > window.innerWidth - pad) left = ev.clientX - rect.width - 14;
    if (top < pad) top = ev.clientY + 14;
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
  }

  function showTooltip(ev, dateText, rec) {
    const html = `
      <div class="tip-date">${dateText}</div>
      <div class="tip-total">${exactFmt.format(rec.tokens)} Tokens</div>
      <div class="tip-rows">
        <span>输入</span><span>${exactFmt.format(rec.input)}</span>
        <span>缓存读取</span><span>${exactFmt.format(rec.cached)}</span>
        <span>输出</span><span>${exactFmt.format(rec.output)}</span>
      </div>
    `;
    tooltip.innerHTML = html;
    tooltip.classList.add('visible');
    positionTooltip(ev);
  }

  function showSegmentTooltip(ev, segKey, segTitle, segColor, segTotal, grandTotal, modelRows) {
    const pct = grandTotal > 0 ? ((segTotal / grandTotal) * 100).toFixed(1) : '0.0';
    const breakdown = modelRows.map(m => {
      const val = m[segKey] || 0;
      const mPct = segTotal > 0 ? ((val / segTotal) * 100).toFixed(1) : '0.0';
      const col = modelColors[m.model] || 'var(--palette-accent)';
      return `
        <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:6px;height:6px;border-radius:50%;background:${col};display:inline-block"></i>${m.model}</span>
        <span>${formatCompact(val)} (${mPct}%)</span>
      `;
    }).join('');
    tooltip.innerHTML = `
      <div class="tip-date" style="display:flex;align-items:center;gap:6px">
        <span style="width:8px;height:8px;border-radius:2px;background:${segColor};display:inline-block"></span>
        <span>${segTitle}</span>
      </div>
      <div class="tip-total">${exactFmt.format(segTotal)} Tokens (${pct}%)</div>
      <div style="border-top:1px solid var(--palette-line);padding-top:4px;margin:2px 0 3px;font-size:10.5px;color:var(--palette-fg-faint)">各模型在该项中的占比：</div>
      <div class="tip-rows">${breakdown}</div>
    `;
    tooltip.classList.add('visible');
    positionTooltip(ev);
  }

  function showModelTooltip(ev, row, grandTotal) {
    const share = grandTotal > 0 ? ((row.tokens / grandTotal) * 100).toFixed(1) : '0.0';
    const col = modelColors[row.model] || 'var(--palette-accent)';
    const pIn = row.tokens > 0 ? ((row.input / row.tokens) * 100).toFixed(1) : '0.0';
    const pCa = row.tokens > 0 ? ((row.cached / row.tokens) * 100).toFixed(1) : '0.0';
    const pOut = row.tokens > 0 ? ((row.output / row.tokens) * 100).toFixed(1) : '0.0';
    tooltip.innerHTML = `
      <div class="tip-date" style="display:flex;align-items:center;gap:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:${col};display:inline-block"></span>
        <span style="font-family:var(--font-mono)">${row.model}</span>
      </div>
      <div class="tip-total">${exactFmt.format(row.tokens)} Tokens（占总用量 ${share}%）</div>
      <div class="tip-rows">
        <span>输入</span><span>${exactFmt.format(row.input)} (${pIn}%)</span>
        <span>缓存读取</span><span>${exactFmt.format(row.cached)} (${pCa}%)</span>
        <span>输出</span><span>${exactFmt.format(row.output)} (${pOut}%)</span>
      </div>
    `;
    tooltip.classList.add('visible');
    positionTooltip(ev);
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
  }

  function render() {
    populateSelects();

    const project = getProject();
    const scopedSessions = getScopedSessions(project);
    const currentSession = project.sessions.find(s => s.id === state.sessionId);
    const data = summarize(scopedSessions, state.model, state.period);

    // 面包屑
    const crumbs = [
      `<span>${project.name}</span>`,
      `<span class="sep">/</span>`,
      `<span class="current">${currentSession ? currentSession.title : '全部会话'}</span>`,
    ];
    if (state.model) {
      crumbs.push(`<span class="sep">/</span><span class="current">${state.model}</span>`);
    }
    $('breadcrumb').innerHTML = crumbs.join('');

    // 周期分段角标
    const periodNames = { year: '近 12 个月', month: '本月', week: '本周' };
    for (const p of ['year', 'month', 'week']) {
      $(`seg-${p}`).textContent = formatCompact(data.periodSummary[p].tokens);
    }
    document.querySelectorAll('#periodGroup button').forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.period === state.period));
    });

    // 范围标识与日期区间
    const clis = [...new Set(scopedSessions.map(s => s.cli))];
    $('scopeChip').innerHTML = `<span class="scope-dot"></span><span>${currentSession ? currentSession.cli : clis.join(' · ')}</span>`;
    $('dateRangeText').textContent = data.rangeText;

    // 4 张 KPI 卡
    $('kpiPeriodTag').textContent = periodNames[state.period];
    $('kpiTokens').textContent = formatCompact(data.totals.tokens);
    $('kpiTokensExact').textContent = `${exactFmt.format(data.totals.tokens)} Tokens`;

    const cacheRate = data.totals.tokens > 0 ? ((data.totals.cached / data.totals.tokens) * 100).toFixed(1) : '0.0';
    $('kpiCacheRate').textContent = `${cacheRate}%`;
    $('kpiCacheDetail').textContent = `缓存读取 ${formatCompact(data.totals.cached)}`;

    $('kpiSessions').textContent = currentSession ? '1' : `${data.activeSessions}`;
    $('kpiSessionsDetail').textContent = currentSession
      ? `当前会话 · ${data.models.length} 个模型`
      : `共 ${project.sessions.length} 条会话 · ${data.models.length} 个模型`;

    $('kpiDays').textContent = `${data.activeDays} 天`;
    const dailyAvg = data.activeDays > 0 ? Math.round(data.totals.tokens / data.activeDays) : 0;
    $('kpiDailyAvg').textContent = `活跃日均 ${formatCompact(dailyAvg)}`;

    // 活跃趋势卡片：近 12 个月热力图 / 本月&本周柱状趋势图
    $('chartPeak').textContent = `单日峰值 ${formatCompact(data.peak)}`;
    const chartContainer = $('chartContainer');
    const chartLegendArea = $('chartLegendArea');

    if (state.period === 'year') {
      $('chartTitle').textContent = '每日 Token 活跃热力图';
      chartLegendArea.innerHTML = `
        <div class="heat-legend" aria-label="活跃度图例">
          <span>低</span>
          <span class="heat-cell" data-level="0"></span>
          <span class="heat-cell" data-level="1"></span>
          <span class="heat-cell" data-level="2"></span>
          <span class="heat-cell" data-level="3"></span>
          <span class="heat-cell" data-level="4"></span>
          <span>高</span>
        </div>
      `;

      const weekdaysHtml = `
        <div class="heatmap-weekdays" aria-hidden="true">
          <span></span>
          <span>一</span>
          <span></span>
          <span>三</span>
          <span></span>
          <span>五</span>
          <span></span>
          <span>日</span>
        </div>
      `;

      const weeksHtml = data.weeks.map(w => `
        <div class="heatmap-week">
          <span class="heatmap-month">${w.monthLabel}</span>
          ${w.days.map(d => d.visible
            ? `<span class="heat-cell" data-level="${d.level}" data-date="${d.date}" data-tokens="${d.rec.tokens}" data-input="${d.rec.input}" data-cached="${d.rec.cached}" data-output="${d.rec.output}"></span>`
            : `<span></span>`
          ).join('')}
        </div>
      `).join('');

      chartContainer.innerHTML = `<div class="heatmap-scroll"><div class="heatmap-grid">${weekdaysHtml}${weeksHtml}</div></div>`;
      // 默认滚到右侧最新日期
      const scroller = chartContainer.querySelector('.heatmap-scroll');
      if (scroller) scroller.scrollLeft = scroller.scrollWidth;

      chartContainer.querySelectorAll('.heat-cell[data-date]').forEach(cell => {
        cell.addEventListener('mousemove', (ev) => {
          showTooltip(ev, cell.dataset.date, {
            tokens: Number(cell.dataset.tokens),
            input: Number(cell.dataset.input),
            cached: Number(cell.dataset.cached),
            output: Number(cell.dataset.output),
          });
        });
        cell.addEventListener('mouseleave', hideTooltip);
      });
    } else {
      $('chartTitle').textContent = state.period === 'week' ? '本周每日消耗分布' : '本月每日消耗分布';
      chartLegendArea.innerHTML = `<span class="card-subtitle">悬停柱体查看当日拆分</span>`;
      const cols = data.daySeries.length;
      const showValInline = cols <= 10;
      const barsHtml = data.daySeries.map((d, idx) => {
        const pct = data.peak > 0 ? Math.max(d.rec.tokens > 0 ? 6 : 0, Math.round((d.rec.tokens / data.peak) * 100)) : 0;
        const showLabel = cols <= 12 || idx === 0 || idx === cols - 1 || idx % 3 === 0;
        return `
          <div class="bar-col" data-date="${d.date}" data-tokens="${d.rec.tokens}" data-input="${d.rec.input}" data-cached="${d.rec.cached}" data-output="${d.rec.output}">
            <span class="bar-val">${showValInline && d.rec.tokens > 0 ? formatCompact(d.rec.tokens) : ''}</span>
            <div class="bar-track">
              <div class="bar-fill ${d.rec.tokens === 0 ? 'zero' : ''}" style="height:${pct}%"></div>
            </div>
            <span class="bar-label">${showLabel ? d.label : ''}</span>
          </div>
        `;
      }).join('');

      chartContainer.innerHTML = `<div class="bar-chart" style="grid-template-columns:repeat(${cols}, minmax(0, 1fr))">${barsHtml}</div>`;
      chartContainer.querySelectorAll('.bar-col').forEach(col => {
        col.addEventListener('mousemove', (ev) => {
          showTooltip(ev, col.dataset.date, {
            tokens: Number(col.dataset.tokens),
            input: Number(col.dataset.input),
            cached: Number(col.dataset.cached),
            output: Number(col.dataset.output),
          });
        });
        col.addEventListener('mouseleave', hideTooltip);
      });
    }

    // Token 构成条 + 模型明细表
    const filterActions = $('modelFilterActions');
    filterActions.innerHTML = state.model
      ? `<button type="button" class="clear-filter-btn" id="clearModelFilter">清除模型筛选 (${state.model}) ×</button>`
      : '';
    const clearBtn = $('clearModelFilter');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        state.model = '';
        render();
      });
    }

    const compWrap = $('compositionWrap');
    const tableWrap = $('modelTableWrap');

    if (!data.models.length || data.totals.tokens === 0) {
      $('modelBriefList').innerHTML = '';
      compWrap.style.display = 'none';
      tableWrap.innerHTML = `<div class="empty-state">当前筛选范围在「${periodNames[state.period]}」内暂无可读取的 Token 记录。</div>`;
    } else {
      compWrap.style.display = 'flex';
      $('modelBriefList').innerHTML = `
        <span class="filter-badge neutral">共 ${data.models.length} 个模型</span>
        ${data.models.map(r => {
          const sh = (r.tokens / data.totals.tokens * 100).toFixed(1);
          const col = modelColors[r.model] || 'var(--palette-accent)';
          return `
            <span class="model-brief-chip ${state.model === r.model ? 'active' : ''}" data-brief-model="${r.model}">
              <span style="width:6px;height:6px;border-radius:50%;background:${col}"></span>
              <b>${r.model}</b>
              <span>${formatCompact(r.tokens)}</span>
              <span class="pct">${sh}%</span>
            </span>
          `;
        }).join('')}
      `;

      $('modelBriefList').querySelectorAll('[data-brief-model]').forEach(chip => {
        const mName = chip.dataset.briefModel;
        const row = data.models.find(x => x.model === mName);
        chip.addEventListener('mousemove', e => showModelTooltip(e, row, data.totals.tokens));
        chip.addEventListener('mouseleave', hideTooltip);
        chip.addEventListener('click', () => { hideTooltip(); state.model = state.model === mName ? '' : mName; render(); });
      });

      const inPct = (data.totals.input / data.totals.tokens) * 100;
      const caPct = (data.totals.cached / data.totals.tokens) * 100;
      const outPct = (data.totals.output / data.totals.tokens) * 100;

      $('stackedBar').innerHTML = `
        <div class="stacked-seg seg-input" data-seg="input" style="width:${inPct.toFixed(2)}%"></div>
        <div class="stacked-seg seg-cached" data-seg="cached" style="width:${caPct.toFixed(2)}%"></div>
        <div class="stacked-seg seg-output" data-seg="output" style="width:${outPct.toFixed(2)}%"></div>
      `;

      $('compositionLegend').innerHTML = `
        <span class="legend-item" data-seg="input"><span class="legend-dot seg-input"></span>输入 <strong>${formatCompact(data.totals.input)}</strong> <span class="legend-pct">(${inPct.toFixed(1)}%)</span></span>
        <span class="legend-item" data-seg="cached"><span class="legend-dot seg-cached"></span>缓存读取 <strong>${formatCompact(data.totals.cached)}</strong> <span class="legend-pct">(${caPct.toFixed(1)}%)</span></span>
        <span class="legend-item" data-seg="output"><span class="legend-dot seg-output"></span>输出 <strong>${formatCompact(data.totals.output)}</strong> <span class="legend-pct">(${outPct.toFixed(1)}%)</span></span>
      `;

      const segConfig = {
        input:  { title:'输入 (Input Tokens)', color:'var(--palette-accent)', total: data.totals.input },
        cached: { title:'缓存读取 (Cached Read)', color:'var(--palette-success)', total: data.totals.cached },
        output: { title:'输出 (Output Tokens)', color:'var(--palette-violet)', total: data.totals.output },
      };
      document.querySelectorAll('#stackedBar [data-seg], #compositionLegend [data-seg]').forEach(el => {
        const k = el.dataset.seg;
        const cfg = segConfig[k];
        el.addEventListener('mousemove', e => showSegmentTooltip(e, k, cfg.title, cfg.color, cfg.total, data.totals.tokens, data.models));
        el.addEventListener('mouseleave', hideTooltip);
      });

      const rowsHtml = data.models.map(row => {
        const share = (row.tokens / data.totals.tokens) * 100;
        const color = modelColors[row.model] || 'var(--palette-accent)';
        const activeClass = state.model === row.model ? 'active-row' : '';
        return `
          <tr class="${activeClass}" data-model="${row.model}">
            <td>
              <div class="model-cell">
                <div class="model-name-row">
                  <span class="model-dot" style="background:${color}"></span>
                  <span class="model-name">${row.model}</span>
                </div>
                <div class="model-share-bar"><div class="model-share-fill" style="width:${share.toFixed(1)}%; background:${color}"></div></div>
              </div>
            </td>
            <td class="td-total">${exactFmt.format(row.tokens)}<span class="td-share">${share.toFixed(1)}%</span></td>
            <td>${exactFmt.format(row.input)}</td>
            <td>${exactFmt.format(row.cached)}</td>
            <td>${exactFmt.format(row.output)}</td>
          </tr>
        `;
      }).join('');

      tableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>模型</th>
              <th>总 Tokens / 占比</th>
              <th>输入</th>
              <th>缓存读取</th>
              <th>输出</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;

      tableWrap.querySelectorAll('tbody tr').forEach(tr => {
        const clicked = tr.dataset.model;
        const row = data.models.find(x => x.model === clicked);
        tr.addEventListener('mousemove', e => showModelTooltip(e, row, data.totals.tokens));
        tr.addEventListener('mouseleave', hideTooltip);
        tr.addEventListener('click', () => {
          hideTooltip();
          state.model = state.model === clicked ? '' : clicked;
          render();
        });
      });
    }

    // 底部右侧数据覆盖范围说明
    if (!state.sessionId) {
      const missingText = project.missingSessions ? ` · ${project.missingSessions} 条缺少明细` : '';
      $('footerMeta').textContent = `已汇总最近 ${project.sessions.length} 条会话${missingText}`;
    } else {
      $('footerMeta').textContent = `单会话视图 · ${currentSession.cli}`;
    }
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#cselectPopover') && !e.target.closest('.cselect-trigger')) closeCustomSelect();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCustomSelect(); });

  // 周期切换
  document.querySelectorAll('#periodGroup button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.period = btn.dataset.period;
      render();
    });
  });

  // 刷新反馈
  $('refreshBtn').addEventListener('click', () => {
    const btn = $('refreshBtn');
    btn.classList.add('spin');
    setTimeout(() => {
      btn.classList.remove('spin');
      render();
    }, 360);
  });

  // 原型顶部场景预设切换
  const presets = {
    'session-multi': { projectId: 'tabby-oneai', sessionId: 'tabby-s1', model: '', period: 'year' },
    'session-single': { projectId: 'tabby-oneai', sessionId: 'tabby-s1-single', model: '', period: 'year' },
    'project-all': { projectId: 'tabby-oneai', sessionId: '', model: '', period: 'year' },
    'wsl-project': { projectId: 'know-video', sessionId: '', model: '', period: 'month' },
  };

  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.assign(state, presets[btn.dataset.preset]);
      render();
    });
  });

  // 配色预览切换
  document.querySelectorAll('[data-theme-btn]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-theme-btn]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.documentElement.setAttribute('data-theme', btn.dataset.themeBtn);
    });
  });

  render();
})();
</script>
</body>
</html>
